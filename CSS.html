<style>
    :root {
        --sidebar-width: 250px;
        --sidebar-collapsed-width: 0px;
    }

    body {
        overflow-x: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Sidebar Styling */
    #wrapper {
        display: flex;
        width: 100%;
        height: 100vh;
    }

    #sidebar-wrapper {
        width: var(--sidebar-width);
        transition: all 0.3s ease;
        flex-shrink: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
    }

    #wrapper.toggled #sidebar-wrapper {
        margin-left: calc(var(--sidebar-width) * -1);
    }

    #page-content-wrapper {
        width: 100%;
        min-width: 0;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }

    /* Navigation Links */
    .list-group-item {
        border-radius: 0.375rem !important;
        margin-bottom: 0.25rem;
        border: none !important;
        background-color: transparent;
        color: #adb5bd !important;
        transition: all 0.2s;
    }

    .list-group-item:hover {
        background-color: rgba(255, 255, 255, 0.1) !important;
        color: #fff !important;
    }

    .list-group-item.active {
        background-color: #0d6efd !important;
        color: #fff !important;
        font-weight: 500;
    }

    .w-20 {
        width: 20px;
        text-align: center;
    }

    /* Custom Card Styling */
    .metric-card {
        transition: transform 0.2s;
        border: none;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }

    .metric-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }

    .metric-icon {
        font-size: 2.5rem;
        opacity: 0.8;
    }

    /* Table Styling */
    .table-container {
        background: #fff;
        border-radius: 0.5rem;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        padding: 1rem;
        overflow-x: auto;
    }

    .table th {
        font-weight: 600;
        background-color: #f8f9fa;
        color: #495057;
        white-space: nowrap;
    }

    .table td {
        vertical-align: middle;
    }

    /* Status Badges */
    .badge-ok { background-color: #198754; color: white; }
    .badge-low { background-color: #ffc107; color: #000; }
    .badge-out { background-color: #dc3545; color: white; }

    /* Loader Overlay for Full Page operations */
    #loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255,255,255,0.7);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    /* Form specifics */
    .transaction-row {
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        padding: 1rem;
        margin-bottom: 1rem;
        position: relative;
    }

    .remove-row-btn {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
    }

    /* Utility */
    .required-asterisk {
        color: #dc3545;
        margin-left: 2px;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        #wrapper {
            overflow-x: hidden;
        }

        #sidebar-wrapper {
            margin-left: calc(var(--sidebar-width) * -1);
            position: absolute;
            height: 100vh;
        }

        #wrapper.toggled #sidebar-wrapper {
            margin-left: 0;
            box-shadow: 0.5rem 0 1rem rgba(0,0,0,0.15);
        }

        .transaction-row .col-md-2,
        .transaction-row .col-md-3 {
            margin-bottom: 10px;
        }

        .remove-row-btn {
            position: static;
            width: 100%;
            margin-top: 10px;
        }
    }
</style>
