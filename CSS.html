<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
  :root {
    --primary-text: #0d6efd;
    --second-text: #adb5bd;
  }

  body {
    background-color: #f8f9fa;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Sidebar Styles */
  #wrapper {
    overflow-x: hidden;
  }
  #sidebar-wrapper {
    min-height: 100vh;
    width: 250px;
    margin-left: -250px;
    transition: margin 0.25s ease-out;
  }
  #sidebar-wrapper .sidebar-heading {
    padding: 0.875rem 1.25rem;
    font-size: 1.2rem;
  }
  #sidebar-wrapper .list-group {
    width: 250px;
  }
  #page-content-wrapper {
    min-width: 100vw;
    transition: margin 0.25s ease-out;
  }
  #wrapper.toggled #sidebar-wrapper {
    margin-left: 0;
  }

  /* Active Sidebar Link */
  .list-group-item.active {
    color: var(--primary-text) !important;
    border-left: 4px solid var(--primary-text);
    background-color: rgba(13, 110, 253, 0.1) !important;
  }
  .list-group-item {
    border: none;
    padding: 15px 20px;
  }
  .list-group-item:hover {
    color: var(--primary-text) !important;
  }

  @media (min-width: 768px) {
    #sidebar-wrapper {
      margin-left: 0;
    }
    #page-content-wrapper {
      min-width: 0;
      width: 100%;
    }
    #wrapper.toggled #sidebar-wrapper {
      margin-left: -250px;
    }
  }

  /* Loading Overlay */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Status Badges */
  .badge-received { background-color: #198754; color: white; padding: 5px 10px; border-radius: 12px; font-size: 0.85em; }
  .badge-pending { background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 12px; font-size: 0.85em; }
  .badge-partial { background-color: #ffc107; color: black; padding: 5px 10px; border-radius: 12px; font-size: 0.85em; }

  /* Input focus styles */
  .form-control:focus, .form-select:focus {
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
  }
</style>
