<script>
function executeSearch() {
    const q = document.getElementById('searchInput').value;
    if(q.length < 3) return alert('Enter at least 3 characters');
    document.getElementById('search-results-container').innerHTML = 'Searching...';
    google.script.run.withSuccessHandler(results => {
        let html = '';
        if(results.length === 0) html = '<p>No results found.</p>';
        else {
            html = '<table class="table"><tr><th>Job No</th><th>BL No</th><th>Stage</th><th>Timeline</th></tr>';
            results.forEach(r => {
                html += `<tr><td>${escapeHtml(r.Job_No)}</td><td>${escapeHtml(r.BL_No)}</td><td>${escapeHtml(r.Stage)}</td>
                <td><button class="btn btn-sm btn-info" onclick="viewTimeline('${escapeHtml(r.Job_No)}')">View Timeline</button></td></tr>`;
            });
            html += '</table>';
        }
        document.getElementById('search-results-container').innerHTML = html;
    }).globalSearch(q);
}

function viewTimeline(jobNo) {
    document.getElementById('search-results-container').innerHTML = `<h4>Loading Timeline for ${escapeHtml(jobNo)}...</h4>`;
    google.script.run.withSuccessHandler(data => {
        if(data.length === 0) {
            document.getElementById('search-results-container').innerHTML = `<h4>Timeline for ${escapeHtml(jobNo)}</h4><p>No timeline events recorded.</p> <button class="btn btn-secondary mt-2" onclick="executeSearch()">Back to Search</button>`;
            return;
        }
        let html = `<h4>Timeline for ${escapeHtml(jobNo)}</h4><ul style="list-style-type:none; padding:0;">`;
        data.forEach(t => {
            let color = t.Status === 'Completed' ? 'var(--success)' : (t.Status === 'Delayed' ? 'var(--danger)' : 'var(--warning)');
            html += `<li style="margin-bottom:10px; padding:10px; border-left:4px solid ${color}; background:#f9f9f9;">
                <strong>${escapeHtml(t.Stage)}</strong> - <small>${new Date(t.Date).toLocaleString()}</small>
                <br>Status: <span style="color:${color}">${escapeHtml(t.Status)}</span>
            </li>`;
        });
        html += `</ul><button class="btn btn-secondary mt-2" onclick="executeSearch()">Back to Search</button>`;
        document.getElementById('search-results-container').innerHTML = html;
    }).getShipmentTimeline(jobNo);
}
</script>
