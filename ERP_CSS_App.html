<style>
:root { --primary: #0b5394; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --bg: #eef2f7; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: var(--bg); color: #333; }
#app-container { display: flex; height: 100vh; overflow: hidden; }
#sidebar { width: 250px; background: #fff; border-right: 1px solid #ddd; }
.sidebar-logo { height: 60px; padding: 0 20px; background: var(--primary); color: white; display: flex; align-items: center;}
.sidebar-nav ul { list-style: none; padding: 10px 0; }
.sidebar-nav li a { display: block; padding: 12px 20px; text-decoration: none; color: #333; }
.sidebar-nav li a.active { background: #f0f5fb; color: var(--primary); border-left: 4px solid var(--primary); }
#main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
#header { height: 60px; background: #fff; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
.kpi-card { background: #fff; border-radius: 8px; padding: 20px; border-top: 4px solid #ddd; }
.kpi-card h2 { font-size: 24px; }
.dashboard-split { display: flex; gap: 20px; padding: 0 20px; }
.dash-panel { flex: 1; background: #fff; border-radius: 8px; padding: 20px; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left;}
</style>
