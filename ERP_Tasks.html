<div class="panel">
    <div class="panel-header">
        <h2>Pending Tasks Center</h2>
    </div>
    <div class="tabs mt-3">
        <button class="btn btn-primary tab-btn" onclick="switchTaskTab('all')">All Pending</button>
        <button class="btn tab-btn" onclick="switchTaskTab('my')">My Tasks</button>
        <button class="btn bg-danger tab-btn" onclick="switchTaskTab('overdue')">Overdue</button>
    </div>
    <div class="table-responsive mt-3">
        <table class="table" id="tasks-table">
            <thead>
                <tr>
                    <th>Job No</th>
                    <th>Task / Stage</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Role</th>
                    <th>Due Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tasks-tbody">
                <tr><td colspan="7">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
