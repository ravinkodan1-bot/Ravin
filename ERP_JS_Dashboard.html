<script>
function initDashboard() {
    google.script.run.withSuccessHandler(data => {
        document.getElementById('kpi-delayed').innerText = data.delayedShipments;
        document.getElementById('kpi-duty').innerText = '₹ ' + data.dutyPending.toLocaleString();
        document.getElementById('kpi-do').innerText = data.doExpiring;
        document.getElementById('kpi-money').innerText = '₹ ' + data.moneyBlocked.total.toLocaleString();
        document.getElementById('kpi-ready').innerText = data.readyForDispatch;
        document.getElementById('kpi-pay').innerText = data.pendingPayments;
        document.getElementById('kpi-overdue').innerText = data.overdueTasks;
        document.getElementById('kpi-today').innerText = data.todaysActions;
    }).getCachedDashboardAnalytics();

    google.script.run.withSuccessHandler(data => {
        let htmlTop = '<table class="table" style="font-size:12px;"><tr><th>CHA</th><th>Rate</th><th>Avg Days</th></tr>';
        data.top5.forEach(d => {
            htmlTop += `<tr><td>${escapeHtml(d.name)}</td><td>${d.completionRate.toFixed(1)}%</td><td>${d.avgClearance.toFixed(1)}</td></tr>`;
        });
        htmlTop += '</table>';
        document.getElementById('dash-top-cha').innerHTML = htmlTop;

        let htmlBot = '<table class="table" style="font-size:12px;"><tr><th>CHA</th><th>Rate</th><th>Avg Days</th></tr>';
        data.bottom5.forEach(d => {
            htmlBot += `<tr><td>${escapeHtml(d.name)}</td><td>${d.completionRate.toFixed(1)}%</td><td>${d.avgClearance.toFixed(1)}</td></tr>`;
        });
        htmlBot += '</table>';
        document.getElementById('dash-bottom-cha').innerHTML = htmlBot;
    }).getCachedCHAPerformance();
}
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    google.script.run.withSuccessHandler(data => {
        const container = document.getElementById('kpi-engine-container');
        if(!container) return;
        container.innerHTML = `
            <div style="background:#f8f9fa; padding:15px; border-radius:5px; border-left:4px solid var(--primary);">
                <small>Avg Clearance Days</small><h4>${data.avgClearanceDays} days</h4>
            </div>
            <div style="background:#f8f9fa; padding:15px; border-radius:5px; border-left:4px solid var(--warning);">
                <small>Doc Receipt Time</small><h4>${data.docReceiptTime} days</h4>
            </div>
            <div style="background:#f8f9fa; padding:15px; border-radius:5px; border-left:4px solid var(--success);">
                <small>BOE Processing Time</small><h4>${data.boeProcessingTime} days</h4>
            </div>
            <div style="background:#f8f9fa; padding:15px; border-radius:5px; border-left:4px solid var(--danger);">
                <small>Duty Clearance Time</small><h4>${data.dutyClearanceTime} days</h4>
            </div>
            <div style="background:#f8f9fa; padding:15px; border-radius:5px; border-left:4px solid #17a2b8;">
                <small>OOC Processing Time</small><h4>${data.oocProcessingTime} days</h4>
            </div>
            <div style="background:#f8f9fa; padding:15px; border-radius:5px; border-left:4px solid #6f42c1;">
                <small>Dispatch Completion Time</small><h4>${data.dispatchCompletionTime} days</h4>
            </div>
        `;
    }).getKPIEngineData();
});
</script>
