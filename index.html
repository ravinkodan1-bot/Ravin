<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>

.nav-bar {
  display: flex;
  background: #0b5394;
  padding: 10px;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
}

.nav-btn {
  background: transparent;
  color: white;
  border: 1px solid white;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin: 0;
  width: auto;
}

.nav-btn.active {
  background: white;
  color: #0b5394;
}

.view-section {
  display: none;
}

.view-section.active {
  display: block;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: white;
}

.box {
  width: 100%;
  min-height: 100vh;
  background: white;
  padding: 20px 0px 50px;
}

@media (min-width: 640px) {
  body {
    background: #eef2f7;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .box {
    max-width: 640px;
    min-height: unset;
    border-radius: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    padding: 28px 28px 40px;
  }
}

h2 {
  text-align: center;
  color: #0b5394;
  margin: 0 0 24px 0;
  font-size: 26px;
  font-weight: 800;
  padding: 0 10px;
}

.section-title {
  font-size: 12px;
  font-weight: 800;
  color: #0b5394;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 22px 0 10px;
  padding: 0 10px 7px;
  border-bottom: 2px solid #e0eaf5;
}

.row {
  margin-bottom: 14px;
  padding: 0 10px;
}

label {
  font-weight: 700;
  display: block;
  margin-bottom: 7px;
  font-size: 15px;
  color: #222;
}

input:not([readonly]),
textarea {
  width: 100%;
  padding: 16px 12px;
  border: 2px solid #d0d8e4;
  border-radius: 10px;
  font-size: 17px;
  outline: none;
  background: #fff;
  color: #111;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
  appearance: none;
}

input:not([readonly]):focus,
textarea:focus {
  border-color: #0b5394;
  box-shadow: 0 0 0 4px rgba(11,83,148,0.12);
}

.custom-select {
  width: 100%;
  padding: 16px 12px;
  border: 2px solid #d0d8e4;
  border-radius: 10px;
  font-size: 17px;
  outline: none;
  background: #fff;
  color: #111;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
  appearance: none;
}

.custom-select:focus {
  border-color: #0b5394;
  box-shadow: 0 0 0 4px rgba(11,83,148,0.12);
}

input[readonly] {
  width: 100%;
  padding: 13px 12px;
  border: 1.5px solid #e0e6ef;
  border-radius: 10px;
  font-size: 15px;
  background: #f0f5fb;
  color: #555;
  outline: none;
}

textarea {
  min-height: 100px;
  resize: vertical;
  line-height: 1.6;
}

.btn-wrap {
  padding: 0 10px;
}

button {
  width: 100%;
  background: #0b5394;
  color: white;
  border: none;
  padding: 18px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 12px;
  -webkit-appearance: none;
  transition: background 0.2s, transform 0.1s;
}

button:active {
  transform: scale(0.97);
  background: #073763;
}

button:disabled {
  background: #7fa8cc;
}

.msg-box {
  margin: 16px 10px 0;
  text-align: center;
  font-weight: 700;
  font-size: 16px;
  padding: 14px;
  border-radius: 12px;
  display: none;
}

.msg-success {
  color: #1a7a1a;
  background: #e6f9e6;
  border: 1.5px solid #b2e0b2;
}

.msg-error {
  color: #b71c1c;
  background: #fdecea;
  border: 1.5px solid #f5c6c6;
}

  </style>
</head>

<body>

<div class="nav-bar">
  <button class="nav-btn active" onclick="switchView(event, 'importView')">Import Form</button>
  <button class="nav-btn" onclick="switchView(event, 'transitView')">Transit Form</button>
  <button class="nav-btn" onclick="switchView(event, 'dashboardView')">Dashboard</button>
</div>

<div class="box view-section" id="dashboardView">
  <h2>📊 Dashboard</h2>
  <div style="display: flex; flex-direction: column; gap: 15px; padding: 10px;">

    <div style="background: #e6f9e6; border: 1px solid #b2e0b2; border-radius: 10px; padding: 20px; text-align: center;">
      <h3 style="margin: 0; color: #1a7a1a; font-size: 16px;">Total Pending Amount</h3>
      <div id="dashPendingAmount" style="font-size: 28px; font-weight: bold; color: #111; margin-top: 10px;">Loading...</div>
    </div>

    <div style="background: #fdecea; border: 1px solid #f5c6c6; border-radius: 10px; padding: 20px; text-align: center;">
      <h3 style="margin: 0; color: #b71c1c; font-size: 16px;">Shipments with Duty Pending</h3>
      <div id="dashDutyPending" style="font-size: 28px; font-weight: bold; color: #111; margin-top: 10px;">Loading...</div>
    </div>

    <div style="background: #e0eaf5; border: 1px solid #0b5394; border-radius: 10px; padding: 20px; text-align: center;">
      <h3 style="margin: 0; color: #0b5394; font-size: 16px;">Shipments Arriving This Week</h3>
      <div id="dashArrivingWeek" style="font-size: 28px; font-weight: bold; color: #111; margin-top: 10px;">Loading...</div>
    </div>

  </div>
</div> <!-- End dashboard view -->

<div class="box view-section" id="transitView">

  <h2>🚚 Transit Entry Form</h2>

  <form id="myForm" autocomplete="off">

    <div class="section-title">From Party</div>

    <div class="row">
      <label>Party Name / फ्रॉम पार्टी</label>
      <input list="fromPartyList" id="fromParty" placeholder="Select or type party name..." required>
      <datalist id="fromPartyList"></datalist>
    </div>
    <div class="row">
      <label>Party Code</label>
      <input type="text" id="fromPartyCode" readonly placeholder="Auto-filled">
    </div>

    <div class="section-title">To Party</div>

    <div class="row">
      <label>Party Name / टू पार्टी</label>
      <input list="toPartyList" id="toParty" placeholder="Select or type party name..." required>
      <datalist id="toPartyList"></datalist>
    </div>
    <div class="row">
      <label>Party Code</label>
      <input type="text" id="toPartyCode" readonly placeholder="Auto-filled">
    </div>

    <div class="section-title">Brand</div>

    <div class="row">
      <label>Brand Name / ब्रांड</label>
      <input list="brandList" id="brandName" placeholder="Select or type brand..." required>
      <datalist id="brandList"></datalist>
    </div>
    <div class="row">
      <label>Brand Code</label>
      <input type="text" id="brandCode" readonly placeholder="Auto-filled">
    </div>

    <div class="section-title">Details</div>

    <div class="row">
      <label>Quantity / मात्रा</label>
      <input type="number" id="qty" placeholder="Enter quantity" inputmode="numeric" required>
    </div>
    <div class="row">
      <label>Vehicle No / गाड़ी नंबर</label>
      <input type="text" id="vehicleNo" placeholder="E.G. DL01AB1234" style="text-transform:uppercase">
    </div>
    <div class="row">
      <label>Remarks / टिप्पणी</label>
      <textarea id="remarks" placeholder="Optional notes..."></textarea>
    </div>

    <div class="btn-wrap">
      <button type="submit" id="submitBtn">Submit / जमा करें</button>
    </div>

  </form>

  <div class="msg-box" id="msg"></div>

</div>

</div> <!-- End transit view -->

<div class="box view-section active" id="importView">
  <h2>🚢 Import Purchase Form</h2>
  <form id="importForm" autocomplete="off">
    <div class="section-title">General Details</div>
    <div class="row">
      <label>Date</label>
      <input type="date" id="importDate" required>
    </div>
    <div class="row">
      <label>Job No</label>
      <input type="text" id="jobNo" placeholder="Job No">
    </div>
    <div class="row">
      <label>Owner</label>
      <input type="text" id="owner" placeholder="Owner Name">
    </div>
    <div class="row">
      <label>Importer</label>
      <input type="text" id="importer" placeholder="Importer Name">
    </div>

    <div class="section-title">Purchase Details</div>
    <div class="row">
      <label>Supplier/Manufacturer</label>
      <input type="text" id="supplier" placeholder="Supplier Name">
    </div>
    <div class="row">
      <label>Item Description</label>
      <input type="text" id="itemDesc" placeholder="Item Description">
    </div>
    <div class="row">
      <label>Invoice No</label>
      <input type="text" id="invoiceNo" placeholder="Invoice No">
    </div>
    <div class="row">
      <label>Invoice Value</label>
      <input type="number" id="invoiceValue" placeholder="Invoice Value" step="0.01">
    </div>
    <div class="row">
      <label>Quantity</label>
      <input type="number" id="importQty" placeholder="Quantity" step="0.01">
    </div>
    <div class="row">
      <label>Rate</label>
      <input type="number" id="rate" placeholder="Rate" step="0.01">
    </div>

    <div class="section-title">Shipping Details</div>
    <div class="row">
      <label>BL No.</label>
      <input type="text" id="blNo" placeholder="BL No.">
    </div>
    <div class="row">
      <label>Shipping Line</label>
      <input type="text" id="shippingLine" placeholder="Shipping Line">
    </div>
    <div class="row">
      <label>DO Validity</label>
      <input type="date" id="doValidity">
    </div>
    <div class="row">
      <label>BE No</label>
      <input type="text" id="beNo" placeholder="BE No">
    </div>
    <div class="row">
      <label>BE Date</label>
      <input type="date" id="beDate">
    </div>
    <div class="row">
      <label>Origin</label>
      <input type="text" id="origin" placeholder="Origin">
    </div>
    <div class="row">
      <label>POD</label>
      <input type="text" id="pod" placeholder="POD">
    </div>
    <div class="row">
      <label>ETA POD</label>
      <input type="date" id="etaPod">
    </div>
    <div class="row">
      <label>ETA CFS</label>
      <input type="date" id="etaCfs">
    </div>

    <div class="section-title">Status & Payments</div>
    <div class="row">
      <label>Payment Terms</label>
      <select id="paymentTerms" class="custom-select">
        <option value="">Select Payment Terms</option>
        <option value="20% Advance & 80% after 1 week bl copy doc">20% Advance & 80% after 1 week bl copy doc</option>
        <option value="20% Advance & 80% against BL copy within 5 days before ETA">20% Advance & 80% against BL copy within 5 days before ETA</option>
        <option value="20% Advance & 80% WITHIN 7 DAYS from shipping date">20% Advance & 80% WITHIN 7 DAYS from shipping date</option>
        <option value="LC at Sight">LC at Sight</option>
        <option value="20% TT in Advance within 3 working days after contract signed remaining 80% within 7 days against copy of B/L Issues">20% TT in Advance within 3 working days after contract signed remaining 80% within 7 days against copy of B/L Issues</option>
        <option value="20% Advance & 80% TT against document copy within 2 weeks">20% Advance & 80% TT against document copy within 2 weeks</option>
      </select>
    </div>
    <div class="row">
      <label>Payment Status</label>
      <select id="paymentStatus" class="custom-select">
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
        <option value="N/A">N/A</option>
      </select>
    </div>
    <div class="row">
      <label>Pending Amount</label>
      <input type="number" id="pendingAmount" placeholder="Pending Amount" step="0.01">
    </div>
    <div class="row">
      <label>Telex Received</label>
      <select id="telexReceived" class="custom-select">
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
        <option value="N/A">N/A</option>
      </select>
    </div>
    <div class="row">
      <label>NN Documents</label>
      <select id="nnDocuments" class="custom-select">
        <option value="Pending">Pending</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <div class="row">
      <label>IGM File</label>
      <input type="text" id="igmFile" placeholder="IGM File">
    </div>
    <div class="row">
      <label>Duty Payment</label>
      <input type="number" id="dutyPayment" placeholder="Duty Payment Amount" step="0.01">
    </div>
    <div class="row">
      <label>Status Duty Pending</label>
      <select id="statusDutyPending" class="custom-select">
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
        <option value="N/A">N/A</option>
      </select>
    </div>
    <div class="row">
      <label>OOC</label>
      <select id="ooc" class="custom-select">
        <option value="Pending">Pending</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <div class="row">
      <label>Shipping Line Payment</label>
      <input type="number" id="shippingLinePayment" placeholder="Shipping Line Payment Amount" step="0.01">
    </div>
    <div class="row">
      <label>Status Line Payment</label>
      <select id="statusLinePayment" class="custom-select">
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
        <option value="N/A">N/A</option>
      </select>
    </div>
    <div class="row">
      <label>DO Released</label>
      <select id="doReleased" class="custom-select">
        <option value="Pending">Pending</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <div class="section-title">Other</div>
    <div class="row">
      <label>Remarks</label>
      <textarea id="importRemarks" placeholder="Optional notes..."></textarea>
    </div>

    <div class="btn-wrap">
      <button type="submit" id="importSubmitBtn">Submit Import Entry</button>
    </div>
  </form>
  <div class="msg-box" id="importMsg"></div>
</div> <!-- End import view -->


<script>
function switchView(event, viewId) {
  document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');

  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  if(viewId === 'dashboardView') {
    document.getElementById("dashPendingAmount").textContent = "Loading...";
    document.getElementById("dashDutyPending").textContent = "Loading...";
    document.getElementById("dashArrivingWeek").textContent = "Loading...";
    google.script.run.withSuccessHandler(updateDashboard).getDashboardData();
  }
}

function updateDashboard(data) {
  document.getElementById("dashPendingAmount").textContent = data.totalPendingAmount.toFixed(2);
  document.getElementById("dashDutyPending").textContent = data.dutyPendingCount;
  document.getElementById("dashArrivingWeek").textContent = data.arrivingThisWeekCount;
}

let partyData = [];
let brandData = [];

google.script.run.withSuccessHandler(function(data) {
  partyData = data.parties;
  brandData = data.brands;

  const fromList  = document.getElementById("fromPartyList");
  const toList    = document.getElementById("toPartyList");
  const brandList = document.getElementById("brandList");

  partyData.forEach(p => {
    let o1 = document.createElement("option"); o1.value = p.name; fromList.appendChild(o1);
    let o2 = document.createElement("option"); o2.value = p.name; toList.appendChild(o2);
  });
  brandData.forEach(b => {
    let o = document.createElement("option"); o.value = b.name; brandList.appendChild(o);
  });

}).getMasterData();


function matchParty(val) {
  let f = partyData.find(p => p.name.trim().toLowerCase() === val.trim().toLowerCase());
  return f ? f.code : "";
}

function matchBrand(val) {
  let f = brandData.find(b => b.name.trim().toLowerCase() === val.trim().toLowerCase());
  return f ? f.code : "";
}

document.getElementById("fromParty").addEventListener("input", function() {
  document.getElementById("fromPartyCode").value = matchParty(this.value);
});

document.getElementById("toParty").addEventListener("input", function() {
  document.getElementById("toPartyCode").value = matchParty(this.value);
});

document.getElementById("brandName").addEventListener("input", function() {
  document.getElementById("brandCode").value = matchBrand(this.value);
});

document.getElementById("vehicleNo").addEventListener("input", function() {
  let pos = this.selectionStart;
  this.value = this.value.toUpperCase();
  this.setSelectionRange(pos, pos);
});

document.getElementById("myForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const btn    = document.getElementById("submitBtn");
  const msgDiv = document.getElementById("msg");

  btn.disabled = true;
  btn.textContent = "Submitting...";
  msgDiv.style.display = "none";

  let obj = {
    fromParty    : document.getElementById("fromParty").value,
    fromPartyCode: document.getElementById("fromPartyCode").value,
    toParty      : document.getElementById("toParty").value,
    toPartyCode  : document.getElementById("toPartyCode").value,
    qty          : document.getElementById("qty").value,
    brandName    : document.getElementById("brandName").value,
    brandCode    : document.getElementById("brandCode").value,
    vehicleNo    : document.getElementById("vehicleNo").value,
    remarks      : document.getElementById("remarks").value
  };

  google.script.run
    .withSuccessHandler(function(res) {
      const ok = res === "Success";
      msgDiv.textContent   = ok ? "✅ Entry submitted successfully!" : "⚠️ " + res;
      msgDiv.className     = "msg-box " + (ok ? "msg-success" : "msg-error");
      msgDiv.style.display = "block";
      if (ok) {
        document.getElementById("myForm").reset();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      btn.disabled = false;
      btn.textContent = "Submit / जमा करें";
    })
    .saveData(obj);
});

document.getElementById("importForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const btn    = document.getElementById("importSubmitBtn");
  const msgDiv = document.getElementById("importMsg");

  btn.disabled = true;
  btn.textContent = "Submitting...";
  msgDiv.style.display = "none";

  let obj = {
    importDate: document.getElementById("importDate").value,
    jobNo: document.getElementById("jobNo").value,
    owner: document.getElementById("owner").value,
    importer: document.getElementById("importer").value,
    supplier: document.getElementById("supplier").value,
    itemDesc: document.getElementById("itemDesc").value,
    invoiceNo: document.getElementById("invoiceNo").value,
    invoiceValue: document.getElementById("invoiceValue").value,
    importQty: document.getElementById("importQty").value,
    rate: document.getElementById("rate").value,
    blNo: document.getElementById("blNo").value,
    shippingLine: document.getElementById("shippingLine").value,
    doValidity: document.getElementById("doValidity").value,
    beNo: document.getElementById("beNo").value,
    beDate: document.getElementById("beDate").value,
    origin: document.getElementById("origin").value,
    pod: document.getElementById("pod").value,
    etaPod: document.getElementById("etaPod").value,
    etaCfs: document.getElementById("etaCfs").value,
    paymentTerms: document.getElementById("paymentTerms").value,
    paymentStatus: document.getElementById("paymentStatus").value,
    pendingAmount: document.getElementById("pendingAmount").value,
    telexReceived: document.getElementById("telexReceived").value,
    nnDocuments: document.getElementById("nnDocuments").value,
    igmFile: document.getElementById("igmFile").value,
    dutyPayment: document.getElementById("dutyPayment").value,
    statusDutyPending: document.getElementById("statusDutyPending").value,
    ooc: document.getElementById("ooc").value,
    shippingLinePayment: document.getElementById("shippingLinePayment").value,
    statusLinePayment: document.getElementById("statusLinePayment").value,
    doReleased: document.getElementById("doReleased").value,
    importRemarks: document.getElementById("importRemarks").value
  };

  google.script.run
    .withSuccessHandler(function(res) {
      const ok = res === "Success";
      msgDiv.textContent   = ok ? "✅ Entry submitted successfully!" : "⚠️ " + res;
      msgDiv.className     = "msg-box " + (ok ? "msg-success" : "msg-error");
      msgDiv.style.display = "block";
      if (ok) {
        document.getElementById("importForm").reset();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      btn.disabled = false;
      btn.textContent = "Submit Import Entry";
    })
    .saveImportData(obj);
});

</script>
</body>
</html>
