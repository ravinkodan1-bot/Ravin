<div class="panel">
    <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Master Data Management</h2>
        <button class="btn btn-primary" onclick="openNewEntityModal()">+ Add New Entity</button>
    </div>

    <div class="mt-3">
        <label>Filter by Type:</label>
        <select id="master_filter_type" class="form-control" style="width:200px; display:inline-block;" onchange="loadMasters()">
            <option value="All">All</option>
            <option value="Importer">Importer</option>
            <option value="Supplier">Supplier</option>
            <option value="CHA">CHA</option>
            <option value="Port">Port</option>
            <option value="Shipping Line">Shipping Line</option>
            <option value="Godown">Godown</option>
        </select>
    </div>

    <div class="table-responsive mt-3">
        <table class="table" id="masters-table">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="masters-tbody">
                <tr><td colspan="6">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="entity-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; width:400px; max-width:90%;">
        <h3>Entity Details</h3>
        <input type="hidden" id="ent_id">
        <div class="form-group mb-2">
            <label>Entity Type</label>
            <select id="ent_type" class="form-control" style="width:100%; padding:8px;">
                <option value="Importer">Importer</option>
                <option value="Supplier">Supplier</option>
                <option value="CHA">CHA</option>
                <option value="Port">Port</option>
                <option value="Shipping Line">Shipping Line</option>
                <option value="Godown">Godown</option>
            </select>
        </div>
        <div class="form-group mb-2"><label>Name</label><input type="text" id="ent_name" class="form-control" style="width:100%; padding:8px;"></div>
        <div class="form-group mb-2"><label>Email</label><input type="email" id="ent_email" class="form-control" style="width:100%; padding:8px;"></div>
        <div class="form-group mb-3"><label>Contact</label><input type="text" id="ent_contact" class="form-control" style="width:100%; padding:8px;"></div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn" style="background:#ddd;" onclick="closeEntityModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveEntity()">Save</button>
        </div>
    </div>
</div>
