<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="row mb-4">
  <div class="col-12 d-flex justify-content-between align-items-center">
    <h2>Dashboard</h2>
    <button class="btn btn-primary" onclick="window.location.hash='#new-job'">
      <i class="fas fa-plus"></i> New Job
    </button>
  </div>
</div>

<!-- KPI Cards -->
<div class="row" id="dashboard-kpis">
  <div class="col-12 col-md-3 mb-4">
    <div class="card bg-primary text-white shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Active Jobs</h5>
        <h2 id="kpi-active-jobs"><i class="fas fa-spinner fa-spin"></i></h2>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-3 mb-4">
    <div class="card bg-warning text-dark shadow-sm">
      <div class="card-body">
        <h5 class="card-title">My Pending Tasks</h5>
        <h2 id="kpi-pending-tasks"><i class="fas fa-spinner fa-spin"></i></h2>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-3 mb-4">
    <div class="card bg-danger text-white shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Overdue Tasks</h5>
        <h2 id="kpi-overdue-tasks"><i class="fas fa-spinner fa-spin"></i></h2>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-3 mb-4">
    <div class="card bg-info text-white shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Pending Container Returns</h5>
        <h2 id="kpi-pending-returns"><i class="fas fa-spinner fa-spin"></i></h2>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <!-- Chart -->
  <div class="col-12 col-md-6 mb-4">
    <div class="card shadow-sm h-100">
      <div class="card-header bg-white">
        <h5 class="mb-0">Jobs by Status</h5>
      </div>
      <div class="card-body">
        <canvas id="jobsStatusChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Pending Task Center (List View) -->
  <div class="col-12 col-md-6 mb-4">
    <div class="card shadow-sm h-100">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">My Pending Tasks</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadMyTasks()">
          <i class="fas fa-sync"></i>
        </button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-light sticky-top">
              <tr>
                <th>Job ID</th>
                <th>Task</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="task-list-body">
              <tr><td colspan="4" class="text-center py-3"><i class="fas fa-spinner fa-spin"></i> Loading Tasks...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let statusChart = null;

function loadDashboardData() {
  google.script.run
    .withSuccessHandler(res => {
      if(res.success) {
        document.getElementById('kpi-active-jobs').innerText = res.data.activeJobs;
        document.getElementById('kpi-pending-tasks').innerText = res.data.myPendingTasks;
        document.getElementById('kpi-overdue-tasks').innerText = res.data.myOverdueTasks;
        document.getElementById('kpi-pending-returns').innerText = res.data.pendingContainerReturns;

        renderStatusChart(res.data.jobsByStatus);
      } else {
        Swal.fire('Error', res.error, 'error');
      }
    })
    .getDashboardSummary();
}

function loadMyTasks() {
  google.script.run
    .withSuccessHandler(res => {
      if(res.success) {
        const tbody = document.getElementById('task-list-body');
        if(res.data.length === 0) {
           tbody.innerHTML = `<tr><td colspan="4" class="text-center py-3 text-success"><i class="fas fa-check-circle"></i> No pending tasks!</td></tr>`;
           return;
        }

        let html = '';
        res.data.forEach(task => {
          let badge = 'bg-warning text-dark';
          if(task.Status === 'OVERDUE') badge = 'bg-danger';
          if(task.Status === 'IN_PROGRESS') badge = 'bg-primary';

          html += `
            <tr>
              <td><small>${escapeHTML(task.Job_ID.substring(0,8))}</small></td>
              <td>${escapeHTML(task.Task_Name)}</td>
              <td><span class="badge ${badge} status-badge">${escapeHTML(task.Status)}</span></td>
              <td>
                <button class="btn btn-sm btn-success" onclick="markTaskComplete('${task.Task_ID}')" title="Complete Task">
                  <i class="fas fa-check"></i>
                </button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
    })
    .getMyTasks();
}

function renderStatusChart(statusData) {
  const ctx = document.getElementById('jobsStatusChart');
  if (statusChart) statusChart.destroy(); // Prevent memory leak on redraw

  const labels = Object.keys(statusData);
  const data = Object.values(statusData);

  if (labels.length === 0) {
     // fallback if no data
     labels.push("No Data");
     data.push(1);
  }

  statusChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: [
          '#0d6efd', '#198754', '#ffc107', '#dc3545', '#0dcaf0', '#6c757d'
        ]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right' }
      }
    }
  });
}

function markTaskComplete(taskId) {
  Swal.fire({
    title: 'Complete Task?',
    text: "Has this task been fully executed?",
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#198754',
    confirmButtonText: 'Yes, complete it!'
  }).then((result) => {
    if (result.isConfirmed) {
      google.script.run
        .withSuccessHandler(res => {
          if(res.success) {
            Swal.fire('Completed!', 'Task has been marked complete.', 'success');
            loadMyTasks();
            loadDashboardData(); // Refresh KPIs
          } else {
             Swal.fire('Error', res.error, 'error');
          }
        })
        .updateTaskStatus(taskId, 'COMPLETED');
    }
  });
}

// Initial Load
loadDashboardData();
loadMyTasks();
</script>
