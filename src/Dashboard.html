<!-- Dashboard.html (Template) -->
<template id="tpl-dashboard">

  <!-- KPI Row -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card h-100 border-start border-primary border-4">
        <div class="card-body px-3 py-2">
          <div class="text-muted small fw-bold text-uppercase mb-1">Today's Orders</div>
          <div class="fs-3 fw-bold text-dark" id="kpi-today">--</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card h-100 border-start border-info border-4">
        <div class="card-body px-3 py-2">
          <div class="text-muted small fw-bold text-uppercase mb-1">Pending</div>
          <div class="fs-3 fw-bold text-dark" id="kpi-pending">--</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card h-100 border-start border-warning border-4">
        <div class="card-body px-3 py-2">
          <div class="text-muted small fw-bold text-uppercase mb-1">Dispatch Pend.</div>
          <div class="fs-3 fw-bold text-dark" id="kpi-dispatch">--</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card h-100 border-start border-danger border-4">
        <div class="card-body px-3 py-2">
          <div class="text-muted small fw-bold text-uppercase mb-1">Delayed</div>
          <div class="fs-3 fw-bold text-danger" id="kpi-delayed">--</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card h-100 border-start border-success border-4">
        <div class="card-body px-3 py-2">
          <div class="text-muted small fw-bold text-uppercase mb-1">Delivered</div>
          <div class="fs-3 fw-bold text-dark" id="kpi-delivered">--</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card h-100 border-start border-dark border-4 bg-danger-subtle bg-opacity-10">
        <div class="card-body px-3 py-2">
          <div class="text-muted small fw-bold text-uppercase mb-1">SLA Breaches</div>
          <div class="fs-3 fw-bold text-dark" id="kpi-slabreach">--</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- Charts -->
    <div class="col-12 col-lg-8">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Orders By Status</span>
          <button class="btn btn-sm btn-outline-secondary" onclick="init_dashboard()"><i class="fa-solid fa-sync"></i></button>
        </div>
        <div class="card-body">
          <canvas id="chart-status" height="100"></canvas>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="card h-100">
        <div class="card-header">Delay Analysis by Stage</div>
        <div class="card-body">
          <canvas id="chart-delay"></canvas>
        </div>
      </div>
    </div>

    <!-- Top Delayed Tables -->
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-header bg-danger text-white">Top 5 Delayed Orders</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0" id="table-delayed-orders">
              <thead><tr><th>Order ID</th><th>Company</th><th>Stage</th><th>Date</th></tr></thead>
              <tbody><tr><td colspan="4" class="text-center">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-header bg-warning">Top Delayed Employees</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0" id="table-delayed-emps">
              <thead><tr><th>Employee</th><th>Delayed Tasks</th></tr></thead>
              <tbody><tr><td colspan="2" class="text-center">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
let dashboardCharts = {};

function init_dashboard() {
  app.showLoader();

  google.script.run
    .withSuccessHandler((res) => {
      app.hideLoader();
      if (res.success) {
        renderDashboard(res.data);
      } else {
        app.toast("Failed to load dashboard data: " + res.message, "danger");
      }
    })
    .withFailureHandler((err) => {
      app.hideLoader();
      app.toast("Server error fetching dashboard", "danger");
    })
    .getDashboardMetrics();
}

function renderDashboard(data) {
  // Update KPIs
  document.getElementById('kpi-today').innerText = data.kpi.totalOrdersToday;
  document.getElementById('kpi-pending').innerText = data.kpi.pendingOrders;
  document.getElementById('kpi-dispatch').innerText = data.kpi.dispatchPending;
  document.getElementById('kpi-delayed').innerText = data.kpi.delayedOrdersCount;
  document.getElementById('kpi-delivered').innerText = data.kpi.deliveredOrders;
  document.getElementById('kpi-slabreach').innerText = data.kpi.slaBreachCount;

  // Render Status Chart
  const ctxStatus = document.getElementById('chart-status');
  if (dashboardCharts['status']) dashboardCharts['status'].destroy();

  dashboardCharts['status'] = new Chart(ctxStatus, {
    type: 'bar',
    data: {
      labels: Object.keys(data.charts.ordersByStatus),
      datasets: [{
        label: 'Orders',
        data: Object.values(data.charts.ordersByStatus),
        backgroundColor: '#0d6efd',
        borderRadius: 4
      }]
    },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });

  // Render Delay Chart
  const ctxDelay = document.getElementById('chart-delay');
  if (dashboardCharts['delay']) dashboardCharts['delay'].destroy();

  dashboardCharts['delay'] = new Chart(ctxDelay, {
    type: 'doughnut',
    data: {
      labels: Object.keys(data.charts.delayAnalysis),
      datasets: [{
        data: Object.values(data.charts.delayAnalysis),
        backgroundColor: ['#dc3545', '#ffc107', '#fd7e14', '#20c997', '#0dcaf0']
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });

  // Render Tables
  const tbodyOrders = document.querySelector('#table-delayed-orders tbody');
  tbodyOrders.innerHTML = '';
  if (data.tables.topDelayedOrders.length === 0) {
    tbodyOrders.innerHTML = '<tr><td colspan="4" class="text-center">No delayed orders</td></tr>';
  } else {
    data.tables.topDelayedOrders.forEach(o => {
      tbodyOrders.innerHTML += `<tr><td>${app.escapeHTML(o.OrderID)}</td><td>${app.escapeHTML(o.Company)}</td><td><span class="badge bg-secondary">${app.escapeHTML(o.Stage)}</span></td><td>${new Date(o.Date).toLocaleDateString()}</td></tr>`;
    });
  }

  const tbodyEmps = document.querySelector('#table-delayed-emps tbody');
  tbodyEmps.innerHTML = '';
  if (data.tables.topDelayedEmployees.length === 0) {
    tbodyEmps.innerHTML = '<tr><td colspan="2" class="text-center">No delayed employees</td></tr>';
  } else {
    data.tables.topDelayedEmployees.forEach(e => {
      tbodyEmps.innerHTML += `<tr><td>${app.escapeHTML(e.User)}</td><td><span class="badge bg-danger">${app.escapeHTML(e.Delays)}</span></td></tr>`;
    });
  }
}
</script>
