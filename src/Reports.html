<!-- Reports.html (Template) -->
<template id="tpl-reports">
  <div class="row">
    <!-- Report Configuration Card -->
    <div class="col-md-4 mb-4">
      <div class="card h-100">
        <div class="card-header bg-dark text-white">
          <i class="fa-solid fa-filter me-2"></i> Report Generator
        </div>
        <div class="card-body">
          <form id="report-form">
            <div class="mb-3">
              <label class="form-label">Report Type</label>
              <select class="form-select" id="report-type" required>
                <option value="ORDER_REPORT">Order Summary Report</option>
                <option value="PERFORMANCE_REPORT">Employee Performance Report</option>
                <option value="DELAY_REPORT" disabled>Delay Analysis (Coming Soon)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-control" id="report-start">
            </div>
            <div class="mb-4">
              <label class="form-label">End Date</label>
              <input type="date" class="form-control" id="report-end">
            </div>
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-primary" onclick="runReport()"><i class="fa-solid fa-play me-2"></i> Generate</button>
              <button type="button" class="btn btn-outline-success" onclick="exportReportCSV()"><i class="fa-solid fa-file-csv me-2"></i> Export CSV</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Report Output Card -->
    <div class="col-md-8 mb-4">
      <div class="card h-100">
        <div class="card-header bg-light">
          <strong>Report Results</strong>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
            <table class="table table-hover table-striped mb-0" id="report-table">
              <thead class="table-dark" id="report-thead">
                <tr><th class="py-3 px-4">Select parameters and generate a report.</th></tr>
              </thead>
              <tbody id="report-tbody">
                <!-- Data injected here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
let currentReportData = null; // Store for CSV export

function init_reports() {
  // Set default dates to current month
  const date = new Date();
  const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
  const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);

  document.getElementById('report-start').value = firstDay.toISOString().split('T')[0];
  document.getElementById('report-end').value = lastDay.toISOString().split('T')[0];
}

function runReport() {
  const type = document.getElementById('report-type').value;
  const start = document.getElementById('report-start').value;
  const end = document.getElementById('report-end').value;

  app.showLoader();
  google.script.run
    .withSuccessHandler(res => {
      app.hideLoader();
      if(res.success) {
        currentReportData = res;
        renderReportTable(res);
      } else {
        app.toast("Report error: " + res.message, "danger");
      }
    })
    .withFailureHandler(err => {
      app.hideLoader();
      app.toast("Failed to fetch report data", "danger");
    })
    .generateReport(type, start, end);
}

function renderReportTable(res) {
  const thead = document.getElementById('report-thead');
  const tbody = document.getElementById('report-tbody');

  thead.innerHTML = '';
  tbody.innerHTML = '';

  // Headers
  let headTr = '<tr>';
  res.headers.forEach(h => {
    headTr += `<th>${app.escapeHTML(h)}</th>`;
  });
  headTr += '</tr>';
  thead.innerHTML = headTr;

  // Data
  if(res.data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${res.headers.length}" class="text-center py-4">No data found for this period.</td></tr>`;
    return;
  }

  res.data.forEach(row => {
    let tr = '<tr>';
    row.forEach(cell => {
      tr += `<td>${cell !== null && cell !== undefined ? app.escapeHTML(cell) : ''}</td>`;
    });
    tr += '</tr>';
    tbody.innerHTML += tr;
  });
}

function exportReportCSV() {
  if(!currentReportData || !currentReportData.headers || currentReportData.data.length === 0) {
    app.toast("Please generate a report first", "warning");
    return;
  }

  // Build CSV string
  let csvContent = "";

  // Header row
  csvContent += currentReportData.headers.map(h => `"${String(h).replace(/"/g, '""')}"`).join(",") + "\n";

  // Data rows
  currentReportData.data.forEach(rowArray => {
    let row = rowArray.map(item => {
      let str = item !== null && item !== undefined ? String(item) : "";
      return `"${str.replace(/"/g, '""')}"`;
    });
    csvContent += row.join(",") + "\n";
  });

  // Trigger download
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);

  const type = document.getElementById('report-type').value;
  const dateStr = new Date().toISOString().split('T')[0];
  link.setAttribute("download", `${type}_${dateStr}.csv`);

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>
