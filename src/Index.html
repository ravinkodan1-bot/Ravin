<!-- Reusable Status Badge Component Function (to be used in JS rendering) -->
<script>
function getStatusBadgeClass(status) {
  switch(status) {
    case 'Draft': return 'bg-secondary';
    case 'Open': return 'bg-primary';
    case 'In Progress': return 'bg-info text-dark';
    case 'Delayed': return 'bg-danger';
    case 'Dispatched': return 'bg-warning text-dark';
    case 'Delivered': return 'bg-success';
    case 'Closed': return 'bg-dark';
    case 'Cancelled': return 'bg-danger';
    default: return 'bg-secondary';
  }
}

<script>
let dashboardCharts = {};

function init_dashboard() {
  app.showLoader();

  google.script.run
    .withSuccessHandler((res) => {
      app.hideLoader();
      if (res.success) {
        renderDashboard(res.data);
      } else {
        app.toast("Failed to load dashboard data: " + res.message, "danger");
      }
    })
    .withFailureHandler((err) => {
      app.hideLoader();
      app.toast("Server error fetching dashboard", "danger");
    })
    .getDashboardMetrics();
}

function renderDashboard(data) {
  // Update KPIs
  document.getElementById('kpi-today').innerText = data.kpi.totalOrdersToday;
  document.getElementById('kpi-pending').innerText = data.kpi.pendingOrders;
  document.getElementById('kpi-dispatch').innerText = data.kpi.dispatchPending;
  document.getElementById('kpi-delayed').innerText = data.kpi.delayedOrdersCount;
  document.getElementById('kpi-delivered').innerText = data.kpi.deliveredOrders;
  document.getElementById('kpi-slabreach').innerText = data.kpi.slaBreachCount;

  // Render Status Chart
  const ctxStatus = document.getElementById('chart-status');
  if (dashboardCharts['status']) dashboardCharts['status'].destroy();

  dashboardCharts['status'] = new Chart(ctxStatus, {
    type: 'bar',
    data: {
      labels: Object.keys(data.charts.ordersByStatus),
      datasets: [{
        label: 'Orders',
        data: Object.values(data.charts.ordersByStatus),
        backgroundColor: '#0d6efd',
        borderRadius: 4
      }]
    },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });

  // Render Delay Chart
  const ctxDelay = document.getElementById('chart-delay');
  if (dashboardCharts['delay']) dashboardCharts['delay'].destroy();

  dashboardCharts['delay'] = new Chart(ctxDelay, {
    type: 'doughnut',
    data: {
      labels: Object.keys(data.charts.delayAnalysis),
      datasets: [{
        data: Object.values(data.charts.delayAnalysis),
        backgroundColor: ['#dc3545', '#ffc107', '#fd7e14', '#20c997', '#0dcaf0']
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });

  // Render Tables
  const tbodyOrders = document.querySelector('#table-delayed-orders tbody');
  tbodyOrders.innerHTML = '';
  if (data.tables.topDelayedOrders.length === 0) {
    tbodyOrders.innerHTML = '<tr><td colspan="4" class="text-center">No delayed orders</td></tr>';
  } else {
    data.tables.topDelayedOrders.forEach(o => {
      tbodyOrders.innerHTML += `<tr><td>${app.escapeHTML(o.OrderID)}</td><td>${app.escapeHTML(o.Company)}</td><td><span class="badge bg-secondary">${app.escapeHTML(o.Stage)}</span></td><td>${new Date(o.Date).toLocaleDateString()}</td></tr>`;
    });
  }

  const tbodyEmps = document.querySelector('#table-delayed-emps tbody');
  tbodyEmps.innerHTML = '';
  if (data.tables.topDelayedEmployees.length === 0) {
    tbodyEmps.innerHTML = '<tr><td colspan="2" class="text-center">No delayed employees</td></tr>';
  } else {
    data.tables.topDelayedEmployees.forEach(e => {
      tbodyEmps.innerHTML += `<tr><td>${app.escapeHTML(e.User)}</td><td><span class="badge bg-danger">${app.escapeHTML(e.Delays)}</span></td></tr>`;
    });
  }
}

<script>
let ordersList = [];
let newOrderModalInstance = null;

function init_orders() {
  app.showLoader();
  google.script.run
    .withSuccessHandler(res => {
      app.hideLoader();
      ordersList = res;
      renderOrdersTable();
    })
    .withFailureHandler(err => {
      app.hideLoader();
      app.toast("Failed to load orders", "danger");
    })
    .getOrders();
}

function renderOrdersTable() {
  const tbody = document.querySelector('#orders-table tbody');
  tbody.innerHTML = '';

  if (ordersList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No orders found.</td></tr>';
    return;
  }

  ordersList.sort((a,b) => new Date(b.CreatedAt) - new Date(a.CreatedAt)).forEach(o => {
    const statusClass = getStatusBadgeClass(o.OverallStatus);
    tbody.innerHTML += `
      <tr>
        <td class="fw-bold text-primary cursor-pointer" onclick="viewOrder('${app.escapeHTML(o.OrderID)}')">${app.escapeHTML(o.OrderID)}</td>
        <td>${o.OrderDate ? new Date(o.OrderDate).toLocaleDateString() : ''}</td>
        <td>${app.escapeHTML(o.PartyName || o.Company)}</td>
        <td><span class="badge bg-light text-dark border">${app.escapeHTML(o.CurrentStage)}</span></td>
        <td><span class="badge ${statusClass}">${app.escapeHTML(o.OverallStatus)}</span></td>
        <td>${app.escapeHTML(o.CurrentOwner || 'Unassigned')}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary" onclick="viewOrder('${app.escapeHTML(o.OrderID)}')"><i class="fa-solid fa-eye"></i></button>
        </td>
      </tr>
    `;
  });
}

function openNewOrderModal() {
  if (!newOrderModalInstance) {
    newOrderModalInstance = new bootstrap.Modal(document.getElementById('newOrderModal'));
  }
  document.getElementById('new-order-form').reset();
  newOrderModalInstance.show();
}

function submitNewOrder() {
  const form = document.getElementById('new-order-form');
  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  const formData = new FormData(form);
  const data = Object.fromEntries(formData.entries());

  app.showLoader();
  google.script.run
    .withSuccessHandler(res => {
      app.hideLoader();
      if (res.success) {
        app.toast("Order created: " + res.orderId);
        newOrderModalInstance.hide();
        init_orders(); // reload
      } else {
        app.toast(res.message, "danger");
      }
    })
    .withFailureHandler(err => {
      app.hideLoader();
      app.toast("Error creating order", "danger");
    })
    .createOrder(data, app.state.user.userId);
}

function viewOrder(orderId) {
  // To be implemented: Open Order Profile detail view
  app.toast("Viewing order " + orderId + " (Detail view pending)");
}

// Kanban Logic
function init_kanban() {
  app.showLoader();
  google.script.run
    .withSuccessHandler(res => {
      app.hideLoader();
      ordersList = res;
      renderKanban();
    })
    .withFailureHandler(err => {
      app.hideLoader();
      app.toast("Failed to load orders for Kanban", "danger");
    })
    .getOrders();
}

function renderKanban() {
  const container = document.getElementById('kanban-container');
  container.innerHTML = '';

  const stages = [
    { id: 'ORDER_RECEIVED', title: 'Received' },
    { id: 'SO_CREATED', title: 'SO Created' },
    { id: 'STOCK_CONFIRMED', title: 'Stock Confirmed' },
    { id: 'TRANSPORT_ASSIGNED', title: 'Transport Ready' },
    { id: 'BILL_GENERATED', title: 'Billed' },
    { id: 'DISPATCHED', title: 'Dispatched' },
    { id: 'DELIVERED', title: 'Delivered' }
  ];

  stages.forEach(stage => {
    const colOrders = ordersList.filter(o => o.CurrentStage === stage.id && o.OverallStatus !== "Cancelled" && o.OverallStatus !== "Closed");

    let cardsHtml = '';
    colOrders.forEach(o => {
      const statusClass = getStatusBadgeClass(o.OverallStatus);
      cardsHtml += `
        <div class="kanban-card" data-id="${app.escapeHTML(o.OrderID)}">
          <div class="d-flex justify-content-between mb-2">
            <span class="kanban-card-title text-primary">${app.escapeHTML(o.OrderID)}</span>
            <span class="badge ${statusClass}" style="font-size:0.7rem;">${app.escapeHTML(o.OverallStatus)}</span>
          </div>
          <div class="kanban-card-meta mb-1"><i class="fa-solid fa-building fa-fw"></i> ${app.escapeHTML(o.PartyName || o.Company)}</div>
          <div class="kanban-card-meta"><i class="fa-regular fa-clock fa-fw"></i> ${new Date(o.CreatedAt).toLocaleDateString()}</div>
        </div>
      `;
    });

    const colHtml = `
      <div class="kanban-column">
        <div class="kanban-header">
          <span>${stage.title}</span>
          <span class="badge bg-secondary rounded-pill">${colOrders.length}</span>
        </div>
        <div class="kanban-cards" data-stage="${stage.id}">
          ${cardsHtml}
        </div>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', colHtml);
  });

  // Initialize SortableJS
  document.querySelectorAll('.kanban-cards').forEach(el => {
    new Sortable(el, {
      group: 'kanban',
      animation: 150,
      ghostClass: 'bg-light',
      onEnd: function (evt) {
        const itemEl = evt.item;
        const toList = evt.to;
        const orderId = itemEl.getAttribute('data-id');
        const newStage = toList.getAttribute('data-stage');
        const oldStage = evt.from.getAttribute('data-stage');

        if (newStage !== oldStage) {
          app.showLoader();
          google.script.run
            .withSuccessHandler(res => {
              app.hideLoader();
              if(res.success) {
                app.toast(`Order ${orderId} moved to ${newStage}`);
                init_kanban(); // Reload to refresh counts and rules
              } else {
                app.toast(res.message, "danger");
                init_kanban(); // Revert
              }
            })
            .updateOrderStage(orderId, newStage, app.state.user.userId, "Moved via Kanban");
        }
      }
    });
  });
}

    .getUserTasks(app.state.user.userId, app.state.user.role);
}

function renderTasksTable(tasks) {
  const tbody = document.querySelector('#tasks-table tbody');
  tbody.innerHTML = '';

  if (!tasks || tasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No pending tasks found. Great job!</td></tr>';
    return;
  }

  tasks.forEach(t => {
    const delay = parseFloat(t.DelayHours) || 0;
    const delayBadge = delay > 0 ? `<span class="badge bg-danger">${delay} hrs</span>` : '<span class="badge bg-success">On Time</span>';

    tbody.innerHTML += `
      <tr>
        <td>${app.escapeHTML(t.TaskID)}</td>
        <td class="fw-bold text-primary cursor-pointer" onclick="app.navigate('orders')">${app.escapeHTML(t.OrderID)}</td>
        <td>${app.escapeHTML(t.TaskType)}</td>
        <td>${new Date(t.DueDate).toLocaleString()}</td>
        <td>${delayBadge}</td>
        <td><span class="badge bg-warning text-dark">${app.escapeHTML(t.Status)}</span></td>
        <td>
          <button class="btn btn-sm btn-success" onclick="completeTask('${app.escapeHTML(t.TaskID)}', '${app.escapeHTML(t.OrderID)}', '${app.escapeHTML(t.TaskType)}')"><i class="fa-solid fa-check"></i> Complete</button>
        </td>
      </tr>
    `;
  });
}

function completeTask(taskId, orderId, type) {
  if(confirm(`Are you sure you want to mark ${type} for ${orderId} as complete?`)) {
    app.showLoader();
    google.script.run
      .withSuccessHandler(res => {
        if(res.success) {
          app.toast("Task completed successfully!");
          init_tasks();
        } else {
          app.hideLoader();
          app.toast(res.message, "danger");
        }
      })
      .updateTask(taskId, app.state.user.userId, "Completed", "Manually completed", app.state.user.userId);
  }
}

          <strong>Report Results</strong>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
            <table class="table table-hover table-striped mb-0" id="report-table">
              <thead class="table-dark" id="report-thead">
                <tr><th class="py-3 px-4">Select parameters and generate a report.</th></tr>
              </thead>
              <tbody id="report-tbody">
                <!-- Data injected here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
let currentReportData = null; // Store for CSV export

function init_reports() {
  // Set default dates to current month
  const date = new Date();
  const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
  const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);

  document.getElementById('report-start').value = firstDay.toISOString().split('T')[0];
  document.getElementById('report-end').value = lastDay.toISOString().split('T')[0];
}

function runReport() {
  const type = document.getElementById('report-type').value;
  const start = document.getElementById('report-start').value;
  const end = document.getElementById('report-end').value;

  app.showLoader();
  google.script.run
    .withSuccessHandler(res => {
      app.hideLoader();
      if(res.success) {
        currentReportData = res;
        renderReportTable(res);
      } else {
        app.toast("Report error: " + res.message, "danger");
      }
    })
    .withFailureHandler(err => {
      app.hideLoader();
      app.toast("Failed to fetch report data", "danger");
    })
    .generateReport(type, start, end);
}

function renderReportTable(res) {
  const thead = document.getElementById('report-thead');
  const tbody = document.getElementById('report-tbody');

  thead.innerHTML = '';
  tbody.innerHTML = '';

  // Headers
  let headTr = '<tr>';
  res.headers.forEach(h => {
    headTr += `<th>${app.escapeHTML(h)}</th>`;
  });
  headTr += '</tr>';
  thead.innerHTML = headTr;

  // Data
  if(res.data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${res.headers.length}" class="text-center py-4">No data found for this period.</td></tr>`;
    return;
  }

  res.data.forEach(row => {
    let tr = '<tr>';
    row.forEach(cell => {
      tr += `<td>${cell !== null && cell !== undefined ? app.escapeHTML(cell) : ''}</td>`;
    });
    tr += '</tr>';
    tbody.innerHTML += tr;
  });
}

function exportReportCSV() {
  if(!currentReportData || !currentReportData.headers || currentReportData.data.length === 0) {
    app.toast("Please generate a report first", "warning");
    return;
  }

  // Build CSV string
  let csvContent = "";

  // Header row
  csvContent += currentReportData.headers.map(h => `"${String(h).replace(/"/g, '""')}"`).join(",") + "\n";

  // Data rows
  currentReportData.data.forEach(rowArray => {
    let row = rowArray.map(item => {
      let str = item !== null && item !== undefined ? String(item) : "";
      return `"${str.replace(/"/g, '""')}"`;
    });
    csvContent += row.join(",") + "\n";
  });

  // Trigger download
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);

  const type = document.getElementById('report-type').value;
  const dateStr = new Date().toISOString().split('T')[0];
  link.setAttribute("download", `${type}_${dateStr}.csv`);

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>
