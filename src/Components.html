<!-- Components.html -->

<!-- Global Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2100;">
  <div id="global-toast" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toast-body">
        Message goes here.
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<!-- Reusable Status Badge Component Function (to be used in JS rendering) -->
<script>
function getStatusBadgeClass(status) {
  switch(status) {
    case 'Draft': return 'bg-secondary';
    case 'Open': return 'bg-primary';
    case 'In Progress': return 'bg-info text-dark';
    case 'Delayed': return 'bg-danger';
    case 'Dispatched': return 'bg-warning text-dark';
    case 'Delivered': return 'bg-success';
    case 'Closed': return 'bg-dark';
    case 'Cancelled': return 'bg-danger';
    default: return 'bg-secondary';
  }
}
</script>
