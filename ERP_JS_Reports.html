<script>
function initReports() {
    document.getElementById('report-job-list').innerHTML = '<option value="">Loading Jobs...</option>';
    google.script.run.withSuccessHandler(data => {
        let opts = '<option value="">Select a Job No</option>';
        data.forEach(s => {
            opts += `<option value="${escapeHtml(s.Job_No)}">${escapeHtml(s.Job_No)}</option>`;
        });
        document.getElementById('report-job-list').innerHTML = opts;
    }).getActiveShipments();
}

function generateSummaryPDF() {
    const jobNo = document.getElementById('report-job-list').value;
    if(!jobNo) return alert("Select a Job No");

    document.getElementById('pdf-result').innerHTML = 'Generating PDF... Please wait.';

    google.script.run.withSuccessHandler(url => {
        document.getElementById('pdf-result').innerHTML = `✅ <a href="${url}" target="_blank">Download PDF Summary</a>`;
    }).generateExecutiveSummaryPDF(jobNo);
}

function loadCHAReport() {
    document.getElementById('cha-result').innerHTML = 'Loading CHA metrics...';
    google.script.run.withSuccessHandler(data => {
        // We assume getting the top 5 and bottom 5 arrays from analytics service
        let html = '<h4>Top 5 Performers</h4><table class="table" style="font-size:12px;"><tr><th>CHA Name</th><th>Completed</th><th>Avg Days</th></tr>';
        data.top5.forEach(d => {
            html += `<tr><td>${escapeHtml(d.name)}</td><td>${d.completed}</td><td>${d.avgClearance.toFixed(1)}</td></tr>`;
        });
        html += '</table>';

        html += '<h4 class="mt-3">Bottom 5 Performers</h4><table class="table" style="font-size:12px;"><tr><th>CHA Name</th><th>Completed</th><th>Avg Days</th></tr>';
        data.bottom5.forEach(d => {
            html += `<tr><td>${escapeHtml(d.name)}</td><td>${d.completed}</td><td>${d.avgClearance.toFixed(1)}</td></tr>`;
        });
        html += '</table>';

        document.getElementById('cha-result').innerHTML = html;
    }).getCachedCHAPerformance();
}

function loadWhatsAppLogs() {
    document.getElementById('wa-result').innerHTML = 'Loading communication logs... <button class="btn btn-primary btn-sm ml-2" onclick="openWAModal()">+ Add Log</button><br><br>';
    google.script.run.withSuccessHandler(data => {
        let html = '<ul style="list-style:none; padding:0; font-size:13px;">';
        data.forEach(d => {
            html += `<li style="border-bottom:1px solid #eee; padding: 5px 0;">
                <strong>${escapeHtml(d.CHA_Name)}</strong> (${escapeHtml(d.Contact_Person)})<br>
                <small>Sent: ${new Date(d.Whatsapp_Date).toLocaleDateString()} | Next: ${new Date(d.Next_Followup).toLocaleDateString()}</small><br>
                <em>${escapeHtml(d.Notes)}</em>
            </li>`;
        });
        html += '</ul>';
        document.getElementById('wa-result').innerHTML += html;
    }).getMasterDataList("FOLLOWUPS");
}

function openWAModal() {
    document.getElementById('wa-modal').style.display = 'flex';
}

function closeWAModal() {
    document.getElementById('wa-modal').style.display = 'none';
}

function saveWALog() {
    const data = {
        cha: document.getElementById('wa_cha').value,
        contact: document.getElementById('wa_contact').value,
        whatsappDate: document.getElementById('wa_wDate').value,
        callDate: document.getElementById('wa_cDate').value,
        notes: document.getElementById('wa_notes').value,
        nextFollowup: document.getElementById('wa_nDate').value
    };

    if(!data.cha || !data.contact) return alert("CHA and Contact are required.");

    google.script.run.withSuccessHandler(() => {
        closeWAModal();
        loadWhatsAppLogs(); // Refresh the list
    }).addWhatsAppLog(data);
}
</script>
