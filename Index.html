<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Management Dashboard</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fa-solid fa-chart-pie me-2"></i> Sales Executive Dashboard
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <span class="nav-link active"><i class="fa-solid fa-calendar-day me-1"></i> <span id="currentDateDisplay"></span></span>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container-fluid py-4 px-4">

    <!-- Filters Section -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="card shadow-sm border-0 filter-card">
          <div class="card-body d-flex flex-wrap align-items-end gap-3">

            <div class="filter-group">
              <label for="startDate" class="form-label fw-semibold text-secondary small text-uppercase">Start Date</label>
              <input type="date" id="startDate" class="form-control form-control-sm">
            </div>

            <div class="filter-group">
              <label for="endDate" class="form-label fw-semibold text-secondary small text-uppercase">End Date</label>
              <input type="date" id="endDate" class="form-control form-control-sm">
            </div>

            <div class="filter-group flex-grow-1" style="max-width: 250px;">
              <label for="brandFilter" class="form-label fw-semibold text-secondary small text-uppercase">Brand</label>
              <select id="brandFilter" class="form-select form-select-sm">
                <option value="">All Brands</option>
                <!-- Options populated dynamically -->
              </select>
            </div>

            <div class="filter-actions ms-auto">
              <button id="applyFiltersBtn" class="btn btn-primary btn-sm px-4 fw-semibold shadow-sm">
                <i class="fa-solid fa-filter me-1"></i> Apply Filters
              </button>
              <button id="resetFiltersBtn" class="btn btn-outline-secondary btn-sm px-3 ms-2 fw-semibold shadow-sm">
                <i class="fa-solid fa-rotate-left"></i>
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Loading Overlay / Spinner -->
    <div id="loadingOverlay" class="text-center py-5">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
      <h5 class="mt-3 text-secondary">Fetching latest data...</h5>
    </div>

    <!-- Error Message Display -->
    <div id="errorMessage" class="alert alert-danger d-none" role="alert">
      <i class="fa-solid fa-triangle-exclamation me-2"></i> <span id="errorText"></span>
    </div>

    <!-- Dashboard Content (Hidden initially until loaded) -->
    <div id="dashboardContent" class="d-none">

      <!-- KPIs Row -->
      <div class="row g-4 mb-4">

        <div class="col-xl-3 col-md-6">
          <div class="card kpi-card shadow-sm border-0 bg-white h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="text-secondary text-uppercase fw-bold mb-0">Total Revenue</h6>
                <div class="icon-shape bg-primary text-white rounded-circle">
                  <i class="fa-solid fa-indian-rupee-sign"></i>
                </div>
              </div>
              <h3 class="fw-bold text-dark mb-1" id="kpiTotalAmount">₹0.00</h3>
              <p class="text-muted small mb-0">Overall gross sales</p>
            </div>
          </div>
        </div>

        <div class="col-xl-3 col-md-6">
          <div class="card kpi-card shadow-sm border-0 bg-white h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="text-secondary text-uppercase fw-bold mb-0">Total Pairs Sold</h6>
                <div class="icon-shape bg-success text-white rounded-circle">
                  <i class="fa-solid fa-shoe-prints"></i>
                </div>
              </div>
              <h3 class="fw-bold text-dark mb-1" id="kpiTotalPairs">0</h3>
              <p class="text-muted small mb-0">Total volume moved</p>
            </div>
          </div>
        </div>

        <div class="col-xl-3 col-md-6">
          <div class="card kpi-card shadow-sm border-0 bg-white h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="text-secondary text-uppercase fw-bold mb-0">Total Invoices</h6>
                <div class="icon-shape bg-warning text-white rounded-circle">
                  <i class="fa-solid fa-file-invoice"></i>
                </div>
              </div>
              <h3 class="fw-bold text-dark mb-1" id="kpiTotalInvoices">0</h3>
              <p class="text-muted small mb-0">Number of transactions</p>
            </div>
          </div>
        </div>

        <div class="col-xl-3 col-md-6">
          <div class="card kpi-card shadow-sm border-0 bg-white h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="text-secondary text-uppercase fw-bold mb-0">Avg / Invoice</h6>
                <div class="icon-shape bg-info text-white rounded-circle">
                  <i class="fa-solid fa-money-bill-trend-up"></i>
                </div>
              </div>
              <h3 class="fw-bold text-dark mb-1" id="kpiAvgAmount">₹0.00</h3>
              <p class="text-muted small mb-0">Average order value</p>
            </div>
          </div>
        </div>

      </div>

      <!-- Charts Row 1 -->
      <div class="row g-4 mb-4">

        <!-- Sales Trend Line Chart -->
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 h-100 chart-card">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
              <h5 class="fw-bold text-dark"><i class="fa-solid fa-chart-line text-primary me-2"></i>Sales Trends Over Time</h5>
            </div>
            <div class="card-body">
              <div class="chart-container" style="position: relative; height:300px; width:100%">
                <canvas id="trendChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Brand Distribution Doughnut Chart -->
        <div class="col-lg-4">
          <div class="card shadow-sm border-0 h-100 chart-card">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
              <h5 class="fw-bold text-dark"><i class="fa-solid fa-chart-pie text-success me-2"></i>Revenue by Brand</h5>
            </div>
            <div class="card-body d-flex justify-content-center align-items-center">
              <div class="chart-container" style="position: relative; height:280px; width:100%">
                <canvas id="brandChart"></canvas>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Charts Row 2 -->
      <div class="row g-4">

        <!-- Top SKUs Bar Chart -->
        <div class="col-12">
          <div class="card shadow-sm border-0 chart-card">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
              <h5 class="fw-bold text-dark"><i class="fa-solid fa-ranking-star text-warning me-2"></i>Top 10 Selling SKUs (Pairs)</h5>
            </div>
            <div class="card-body">
              <div class="chart-container" style="position: relative; height:350px; width:100%">
                <canvas id="skuChart"></canvas>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div> <!-- End Dashboard Content -->

  </div> <!-- End Container -->

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</html>
