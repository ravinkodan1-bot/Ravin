<div class="panel">
    <div class="panel-header">
        <h2>Executive Summary & Reports</h2>
    </div>

    <div style="display:flex; gap: 20px; margin-top: 20px; flex-wrap: wrap;">

        <!-- Executive Summary -->
        <div style="flex: 1; min-width: 300px; padding: 20px; border: 1px solid #eee; border-radius: 8px;">
            <h3>Executive Summary PDF</h3>
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">Generate a complete 1-page PDF summarizing the shipment.</p>
            <select id="report-job-list" class="form-control mb-3" style="width: 100%; padding: 8px;">
                <option value="">Loading Jobs...</option>
            </select>
            <button class="btn btn-primary" onclick="generateSummaryPDF()" style="width: 100%; margin-top:10px;">Generate PDF</button>
            <div id="pdf-result" style="margin-top: 15px;"></div>
        </div>

        <!-- CHA Performance -->
        <div style="flex: 1; min-width: 300px; padding: 20px; border: 1px solid #eee; border-radius: 8px;">
            <h3>CHA Performance Tracker</h3>
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">View clearance times and rankings.</p>
            <button class="btn btn-primary" onclick="loadCHAReport()" style="width: 100%;">Load Analytics</button>
            <div id="cha-result" style="margin-top: 15px;"></div>
        </div>

        <!-- WhatsApp Logs -->
        <div style="flex: 1; min-width: 300px; padding: 20px; border: 1px solid #eee; border-radius: 8px;">
            <h3>WhatsApp Follow-Up Logs</h3>
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">Track communications with vendors and agents.</p>
            <button class="btn btn-primary" onclick="loadWhatsAppLogs()" style="width: 100%;">View Logs</button>
            <div id="wa-result" style="margin-top: 15px;"></div>
        </div>

    </div>
</div>

<!-- Modal for New Followup -->
<div id="wa-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; width:400px; max-width:90%;">
        <h3>New Follow-Up Log</h3>

        <div class="form-group mb-2"><label>CHA Name</label><input type="text" id="wa_cha" class="form-control" style="width:100%; padding:8px;"></div>
        <div class="form-group mb-2"><label>Contact Person</label><input type="text" id="wa_contact" class="form-control" style="width:100%; padding:8px;"></div>
        <div class="form-group mb-2"><label>WhatsApp Sent Date</label><input type="date" id="wa_wDate" class="form-control" style="width:100%; padding:8px;"></div>
        <div class="form-group mb-2"><label>Call Date</label><input type="date" id="wa_cDate" class="form-control" style="width:100%; padding:8px;"></div>
        <div class="form-group mb-2"><label>Notes</label><textarea id="wa_notes" class="form-control" style="width:100%; padding:8px;"></textarea></div>
        <div class="form-group mb-3"><label>Next Follow-Up Date</label><input type="date" id="wa_nDate" class="form-control" style="width:100%; padding:8px;"></div>

        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn" style="background:#ddd;" onclick="closeWAModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveWALog()">Save</button>
        </div>
    </div>
</div>
