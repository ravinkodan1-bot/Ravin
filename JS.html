<script>
    // --- GLOBAL STATE ---
    let masterDataCache = null; // Holds categories, items, UOM, opening stock

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", function() {
        // Toggle Sidebar
        const toggleBtn = document.getElementById("menu-toggle");
        if(toggleBtn) {
            toggleBtn.addEventListener("click", function(e) {
                e.preventDefault();
                document.getElementById("wrapper").classList.toggle("toggled");
            });
        }

        // Navigation Setup
        setupNavigation();

        // Initial Data Fetch
        loadDashboard();
    });

    // --- NAVIGATION LOGIC ---
    function setupNavigation() {
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();

                // Update active state
                navLinks.forEach(l => l.classList.remove('active'));
                this.classList.add('active');

                // Update title
                const title = this.innerText.trim();
                document.getElementById('page-title').innerText = title;

                // Switch view
                const targetId = this.getAttribute('data-target');
                const views = document.querySelectorAll('.app-view');
                views.forEach(v => v.classList.add('d-none'));
                document.getElementById(targetId).classList.remove('d-none');

                // Trigger view specific logic
                if(targetId === 'view-dashboard') loadDashboard();
                if(targetId === 'view-new-transaction') initNewTransactionView();
                if(targetId === 'view-live-stock') loadLiveStock();
                if(targetId === 'view-daily-closing') initDailyClosingView();
                if(targetId === 'view-history') loadTransactionHistory();

                // On mobile, auto close sidebar after click
                if(window.innerWidth <= 768) {
                    document.getElementById("wrapper").classList.remove("toggled");
                }
            });
        });
    }

    // --- UI HELPERS ---
    function showGlobalLoading() {
        document.getElementById('global-loading').classList.remove('d-none');
    }

    function hideGlobalLoading() {
        document.getElementById('global-loading').classList.add('d-none');
    }

    function showToast(message, type = 'success') {
        const toastContainer = document.getElementById('toast-container');
        const toastId = 'toast-' + Date.now();
        const bgClass = type === 'success' ? 'text-bg-success' : 'text-bg-danger';
        const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

        const html = `
            <div id="${toastId}" class="toast align-items-center ${bgClass} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="fas ${icon} me-2"></i> ${escapeHTML(message)}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        `;

        toastContainer.insertAdjacentHTML('beforeend', html);
        const toastEl = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
        toast.show();

        toastEl.addEventListener('hidden.bs.toast', function () {
            toastEl.remove();
        });
    }

    function escapeHTML(str) {
        if (!str) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // --- DATA LOADING ---
    function fetchMasterData(callback) {
        if (masterDataCache) {
            if(callback) callback(masterDataCache);
            return;
        }
        showGlobalLoading();
        google.script.run
            .withSuccessHandler(function(data) {
                masterDataCache = data;
                hideGlobalLoading();
                if(callback) callback(data);
            })
            .withFailureHandler(function(err) {
                hideGlobalLoading();
                showToast(err.message, 'error');
            })
            .getMasterData();
    }

    // --- NEW TRANSACTION VIEW ---
    function initNewTransactionView() {
        const view = document.getElementById('view-new-transaction');
        view.innerHTML = `
            <div class="row mb-3">
                <div class="col-md-3 mb-2">
                    <label class="form-label fw-bold">Date <span class="required-asterisk">*</span></label>
                    <input type="date" class="form-control" id="txn-date" required>
                </div>
                <div class="col-md-4 mb-2">
                    <label class="form-label fw-bold">Submitted By (Name) <span class="required-asterisk">*</span></label>
                    <input type="text" class="form-control" id="txn-name" placeholder="Enter your name" required>
                </div>
            </div>

            <div id="txn-rows-container">
                <!-- Rows will be injected here -->
            </div>

            <div class="mb-4 mt-2">
                <button type="button" class="btn btn-outline-primary" id="btn-add-row">
                    <i class="fas fa-plus me-1"></i> Add More
                </button>
            </div>

            <div class="border-top pt-3 text-end">
                <button type="button" class="btn btn-success px-4 fw-bold" id="btn-submit-txn">
                    <i class="fas fa-check-circle me-1"></i> SUBMIT TRANSACTION
                </button>
            </div>
        `;

        // Set default date to today
        document.getElementById('txn-date').valueAsDate = new Date();

        // Setup Add Row button
        document.getElementById('btn-add-row').addEventListener('click', addTransactionRow);

        // Setup Submit button
        document.getElementById('btn-submit-txn').addEventListener('click', validateAndConfirmSubmission);

        // Load data and add first row
        fetchMasterData(function() {
            addTransactionRow(); // Add initial empty row
        });
    }

    function addTransactionRow() {
        if (!masterDataCache) return;

        const container = document.getElementById('txn-rows-container');
        const rowId = 'row-' + Date.now() + Math.floor(Math.random() * 1000);

        let categoryOptions = '<option value="">Select Category...</option>';
        masterDataCache.categories.forEach(cat => {
            categoryOptions += `<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`;
        });

        const html = `
            <div class="transaction-row p-3 mb-3 bg-white border rounded shadow-sm position-relative" id="${rowId}">
                <button type="button" class="btn btn-sm btn-outline-danger position-absolute top-0 end-0 m-2" onclick="removeTransactionRow('${rowId}')" title="Remove Row">
                    <i class="fas fa-trash"></i>
                </button>
                <div class="row mt-2">
                    <div class="col-md-2 mb-2">
                        <label class="form-label small text-secondary">Type <span class="required-asterisk">*</span></label>
                        <select class="form-select row-type" required>
                            <option value="IN">IN</option>
                            <option value="OUT">OUT</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-2">
                        <label class="form-label small text-secondary">Category <span class="required-asterisk">*</span></label>
                        <select class="form-select row-category" onchange="onCategoryChange('${rowId}')" required>
                            ${categoryOptions}
                        </select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label small text-secondary">Item Name <span class="required-asterisk">*</span></label>
                        <select class="form-select row-item" onchange="onItemChange('${rowId}')" disabled required>
                            <option value="">Select Category First</option>
                        </select>
                    </div>
                    <div class="col-md-1 mb-2">
                        <label class="form-label small text-secondary">UOM</label>
                        <input type="text" class="form-control bg-light row-uom" readonly>
                    </div>
                    <div class="col-md-2 mb-2">
                        <label class="form-label small text-secondary">Available</label>
                        <input type="text" class="form-control bg-light row-available text-end" readonly>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-2">
                        <label class="form-label small text-secondary">Quantity <span class="required-asterisk">*</span></label>
                        <input type="number" class="form-control row-qty" min="0.01" step="0.01" required>
                    </div>
                    <div class="col-md-9 mb-2">
                        <label class="form-label small text-secondary">Remarks</label>
                        <input type="text" class="form-control row-remarks" placeholder="Optional notes">
                    </div>
                </div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', html);

        // Hide remove button if it's the only row
        updateRemoveButtons();
    }

    function removeTransactionRow(rowId) {
        const row = document.getElementById(rowId);
        if (row) {
            row.remove();
            updateRemoveButtons();
        }
    }

    function updateRemoveButtons() {
        const rows = document.querySelectorAll('.transaction-row');
        const buttons = document.querySelectorAll('.transaction-row .btn-outline-danger');
        if (rows.length === 1) {
            buttons[0].classList.add('d-none');
        } else {
            buttons.forEach(btn => btn.classList.remove('d-none'));
        }
    }

    function onCategoryChange(rowId) {
        const row = document.getElementById(rowId);
        const categorySelect = row.querySelector('.row-category');
        const itemSelect = row.querySelector('.row-item');
        const uomInput = row.querySelector('.row-uom');
        const availableInput = row.querySelector('.row-available');

        const selectedCat = categorySelect.value;

        itemSelect.innerHTML = '<option value="">Select Item...</option>';
        uomInput.value = '';
        availableInput.value = '';

        if (selectedCat && masterDataCache.itemsByCategory[selectedCat]) {
            masterDataCache.itemsByCategory[selectedCat].forEach(item => {
                // value is RM Code for backend logic, but we display item name
                itemSelect.innerHTML += `<option value="${escapeHTML(item.rmCode)}">${escapeHTML(item.itemName)}</option>`;
            });
            itemSelect.disabled = false;
        } else {
            itemSelect.innerHTML = '<option value="">Select Category First</option>';
            itemSelect.disabled = true;
        }
    }

    function onItemChange(rowId) {
        const row = document.getElementById(rowId);
        const itemSelect = row.querySelector('.row-item');
        const uomInput = row.querySelector('.row-uom');
        const availableInput = row.querySelector('.row-available');
        const qtyInput = row.querySelector('.row-qty');

        const rmCode = itemSelect.value;

        if (rmCode && masterDataCache.items[rmCode]) {
            const item = masterDataCache.items[rmCode];
            uomInput.value = item.uom;
            availableInput.value = 'Loading...';

            // Fetch live actual stock from backend
            google.script.run
                .withSuccessHandler(function(stock) {
                    if(itemSelect.value === rmCode) { // ensure hasn't changed while fetching
                        availableInput.value = stock;
                    }
                })
                .withFailureHandler(function(err) {
                    availableInput.value = 'Error';
                    showToast('Failed to fetch stock: ' + err.message, 'error');
                })
                .getCurrentStock(rmCode);

        } else {
            uomInput.value = '';
            availableInput.value = '';
        }
    }

    function validateAndConfirmSubmission() {
        const dateStr = document.getElementById('txn-date').value;
        const nameStr = document.getElementById('txn-name').value.trim();

        if (!dateStr) {
            showToast('Please select a Date.', 'error');
            return;
        }
        if (!nameStr) {
            showToast('Please enter Submitted By (Name).', 'error');
            return;
        }

        const rows = document.querySelectorAll('.transaction-row');
        if (rows.length === 0) {
            showToast('Please add at least one transaction.', 'error');
            return;
        }

        let payloadRows = [];
        let runningBatchStock = {}; // For local negative check on duplicate rows
        let isValid = true;

        rows.forEach(row => {
            const type = row.querySelector('.row-type').value;
            const category = row.querySelector('.row-category').value;
            const rmCode = row.querySelector('.row-item').value;
            const qtyStr = row.querySelector('.row-qty').value;
            const remarks = row.querySelector('.row-remarks').value;
            const availableStr = row.querySelector('.row-available').value;

            if (!category || !rmCode) {
                showToast('Category and Item are required on all rows.', 'error');
                isValid = false;
                return;
            }

            const qty = parseFloat(qtyStr);
            if (isNaN(qty) || qty <= 0) {
                showToast('Quantity must be greater than 0 on all rows.', 'error');
                isValid = false;
                return;
            }

            if (availableStr === 'Loading...' || availableStr === 'Error') {
                 showToast('Please wait for available stock to finish loading before submitting.', 'error');
                 isValid = false;
                 return;
            }

            const availableStock = parseFloat(availableStr) || 0;

            // Local running stock tracking for duplicate item rows
            if (runningBatchStock[rmCode] === undefined) {
                runningBatchStock[rmCode] = availableStock;
            }

            if (type === 'OUT') {
                if (qty > runningBatchStock[rmCode]) {
                    const itemName = row.querySelector('.row-item').options[row.querySelector('.row-item').selectedIndex].text;
                    showToast(`Insufficient stock for ${itemName}. Available: ${runningBatchStock[rmCode].toFixed(2)}`, 'error');
                    isValid = false;
                    return;
                }
                runningBatchStock[rmCode] -= qty;
            } else {
                runningBatchStock[rmCode] += qty;
            }

            payloadRows.push({
                rmCode: rmCode,
                type: type,
                qty: qty,
                remarks: remarks
            });
        });

        if (!isValid) return;

        // Show confirmation modal
        const modalHtml = `
            <div class="modal fade" id="confirmTxnModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-primary text-white">
                            <h5 class="modal-title">Confirm Transaction</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body text-center p-4">
                            <i class="fas fa-question-circle text-primary mb-3" style="font-size: 3rem;"></i>
                            <p class="fs-5 mb-0">Are you sure you want to submit <strong>${payloadRows.length}</strong> transaction(s)?</p>
                        </div>
                        <div class="modal-footer justify-content-center">
                            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-primary px-4" id="btn-final-submit">Confirm Submit</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('modals-container').innerHTML = modalHtml;
        const modal = new bootstrap.Modal(document.getElementById('confirmTxnModal'));

        document.getElementById('btn-final-submit').addEventListener('click', function() {
            // Disable button to prevent double submit
            this.disabled = true;
            this.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Submitting...';

            const closeBtn = document.querySelector('#confirmTxnModal .btn-close');
            const cancelBtn = document.querySelector('#confirmTxnModal .btn-outline-secondary');
            closeBtn.disabled = true;
            cancelBtn.disabled = true;

            const payload = {
                date: dateStr,
                name: nameStr,
                rows: payloadRows
            };

            google.script.run
                .withSuccessHandler(function(response) {
                    modal.hide();
                    showToast(response.message, 'success');

                    // Reset Form
                    document.getElementById('txn-rows-container').innerHTML = '';
                    addTransactionRow();
                })
                .withFailureHandler(function(err) {
                    // Re-enable on failure
                    const btn = document.getElementById('btn-final-submit');
                    btn.disabled = false;
                    btn.innerHTML = 'Confirm Submit';
                    closeBtn.disabled = false;
                    cancelBtn.disabled = false;

                    showToast(err.message, 'error');
                })
                .submitTransactions(payload);
        });

        modal.show();
    }


    // --- DASHBOARD VIEW ---

        const view = document.getElementById('view-dashboard');
        view.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>';

        google.script.run
            .withSuccessHandler(function(data) {
                renderDashboard(data, view);
            })
            .withFailureHandler(function(err) {
                view.innerHTML = `<div class="alert alert-danger">Failed to load dashboard: ${escapeHTML(err.message)}</div>`;
            })
            .getDashboardData();
    }

    // --- STOCK VIEWS (LIVE & DAILY CLOSING) ---
    function loadLiveStock() {
        const view = document.getElementById('view-live-stock');
        view.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>';

        google.script.run
            .withSuccessHandler(function(data) {
                renderStockTable(data, view, 'Live Current Stock');
            })
            .withFailureHandler(function(err) {
                view.innerHTML = `<div class="alert alert-danger">Failed to load live stock: ${escapeHTML(err.message)}</div>`;
            })
            .getLiveStock();
    }

    function initDailyClosingView() {
        const view = document.getElementById('view-daily-closing');

        const html = `
            <div class="row mb-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold">Select Date</label>
                    <input type="date" class="form-control" id="closing-date" required>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" id="btn-view-closing">
                        <i class="fas fa-search me-1"></i> VIEW CLOSING
                    </button>
                </div>
                <div class="col-md-6 text-end">
                    <button class="btn btn-outline-secondary" id="btn-export-closing" style="display:none;">
                        <i class="fas fa-file-csv me-1"></i> Export CSV
                    </button>
                </div>
            </div>
            <div id="daily-closing-content">
                <div class="text-center text-muted py-5 border rounded bg-white">
                    <i class="fas fa-calendar-alt fa-3x mb-3 text-light"></i>
                    <h5>Select a date to view historical closing stock</h5>
                </div>
            </div>
        `;
        view.innerHTML = html;

        // Set default to today
        document.getElementById('closing-date').valueAsDate = new Date();

        document.getElementById('btn-view-closing').addEventListener('click', function() {
            const dateStr = document.getElementById('closing-date').value;
            if(!dateStr) {
                showToast("Please select a date", "error");
                return;
            }

            const content = document.getElementById('daily-closing-content');
            content.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>';

            google.script.run
                .withSuccessHandler(function(data) {
                    renderStockTable(data, content, `Closing Stock as of ${dateStr}`, 'btn-export-closing');
                })
                .withFailureHandler(function(err) {
                    content.innerHTML = `<div class="alert alert-danger">Failed to load closing stock: ${escapeHTML(err.message)}</div>`;
                })
                .getDailyClosing(dateStr);
        });
    }

    function renderStockTable(data, container, title, exportBtnId = null) {
        // Build filter options based on the data
        const categories = [...new Set(data.map(item => item.category))].sort();

        let catOptions = '<option value="">All Categories</option>';
        categories.forEach(c => {
            catOptions += `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`;
        });

        const html = `
            <div class="table-container">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
                    <h5 class="mb-0 text-secondary"><i class="fas fa-box-open me-2"></i>${escapeHTML(title)}</h5>

                    <div class="d-flex gap-2 mt-2 mt-md-0">
                        <select class="form-select form-select-sm" id="filter-status" style="width: 150px;" onchange="filterStockTable()">
                            <option value="">All Statuses</option>
                            <option value="OK">OK</option>
                            <option value="LOW STOCK">LOW STOCK</option>
                            <option value="OUT OF STOCK">OUT OF STOCK</option>
                        </select>
                        <select class="form-select form-select-sm" id="filter-category" style="width: 180px;" onchange="filterStockTable()">
                            ${catOptions}
                        </select>
                        <input type="text" class="form-control form-control-sm" id="filter-search" placeholder="Search item..." style="width: 200px;" onkeyup="filterStockTable()">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover table-bordered align-middle" id="stock-table">
                        <thead class="table-light">
                            <tr>
                                <th>RM Code</th>
                                <th>Category</th>
                                <th>Item Name</th>
                                <th>UOM</th>
                                <th class="text-end">Opening</th>
                                <th class="text-end text-success">Total IN</th>
                                <th class="text-end text-danger">Total OUT</th>
                                <th class="text-end fw-bold">Closing</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(row => {
                                let badgeClass = 'badge-ok';
                                if (row.status === 'LOW STOCK') badgeClass = 'badge-low';
                                if (row.status === 'OUT OF STOCK') badgeClass = 'badge-out';

                                return `
                                    <tr class="stock-row"
                                        data-cat="${escapeHTML(row.category)}"
                                        data-status="${escapeHTML(row.status)}"
                                        data-search="${escapeHTML(row.rmCode + ' ' + row.itemName).toLowerCase()}">
                                        <td>${escapeHTML(row.rmCode)}</td>
                                        <td>${escapeHTML(row.category)}</td>
                                        <td class="fw-bold">${escapeHTML(row.itemName)}</td>
                                        <td>${escapeHTML(row.uom)}</td>
                                        <td class="text-end">${row.openingStock}</td>
                                        <td class="text-end">${row.totalIn}</td>
                                        <td class="text-end">${row.totalOut}</td>
                                        <td class="text-end fw-bold bg-light">${row.closingStock}</td>
                                        <td><span class="badge ${badgeClass}">${escapeHTML(row.status)}</span></td>
                                    </tr>
                                `;
                            }).join('')}
                            ${data.length === 0 ? '<tr><td colspan="9" class="text-center py-4">No data found</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        container.innerHTML = html;

        // Export logic
        if (exportBtnId) {
            const btn = document.getElementById(exportBtnId);
            if (btn) {
                btn.style.display = 'inline-block';
                // Remove old listeners to prevent multiple fires
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);

                newBtn.addEventListener('click', function() {
                    exportTableToCSV('stock-table', `Closing_Stock_${title.replace(/[^a-z0-9]/gi, '_')}.csv`);
                });
            }
        }
    }

    function filterStockTable() {
        const catFilter = document.getElementById('filter-category').value;
        const statusFilter = document.getElementById('filter-status').value;
        const searchFilter = document.getElementById('filter-search').value.toLowerCase();

        const rows = document.querySelectorAll('.stock-row');

        rows.forEach(row => {
            const cat = row.getAttribute('data-cat');
            const status = row.getAttribute('data-status');
            const search = row.getAttribute('data-search');

            let show = true;
            if (catFilter && cat !== catFilter) show = false;
            if (statusFilter && status !== statusFilter) show = false;
            if (searchFilter && !search.includes(searchFilter)) show = false;

            row.style.display = show ? '' : 'none';
        });
    }

    function exportTableToCSV(tableId, filename) {
        const table = document.getElementById(tableId);
        let csv = [];

        // Headers
        let headers = [];
        const ths = table.querySelectorAll('thead th');
        ths.forEach(th => headers.push('"' + th.innerText.replace(/"/g, '""') + '"'));
        csv.push(headers.join(','));

        // Rows (only visible ones)
        const trs = table.querySelectorAll('tbody tr.stock-row');
        trs.forEach(tr => {
            if(tr.style.display !== 'none') {
                let row = [];
                const tds = tr.querySelectorAll('td');
                tds.forEach(td => row.push('"' + td.innerText.replace(/"/g, '""') + '"'));
                csv.push(row.join(','));
            }
        });

        const csvFile = new Blob([csv.join('\n')], {type: 'text/csv'});
        const downloadLink = document.createElement("a");
        downloadLink.download = filename;
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    // --- TRANSACTION HISTORY VIEW ---
    function loadTransactionHistory() {
        const view = document.getElementById('view-history');

        fetchMasterData(function() {
            let catOptions = '<option value="">All Categories</option>';
            masterDataCache.categories.forEach(c => {
                catOptions += `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`;
            });

            const html = `
                <div class="row mb-3 align-items-end bg-white p-3 rounded shadow-sm">
                    <div class="col-md-2 mb-2">
                        <label class="form-label fw-bold small">From Date</label>
                        <input type="date" class="form-control form-control-sm" id="hist-from">
                    </div>
                    <div class="col-md-2 mb-2">
                        <label class="form-label fw-bold small">To Date</label>
                        <input type="date" class="form-control form-control-sm" id="hist-to">
                    </div>
                    <div class="col-md-2 mb-2">
                        <label class="form-label fw-bold small">Type</label>
                        <select class="form-select form-select-sm" id="hist-type">
                            <option value="">All Types</option>
                            <option value="IN">IN</option>
                            <option value="OUT">OUT</option>
                        </select>
                    </div>
                    <div class="col-md-2 mb-2">
                        <label class="form-label fw-bold small">Category</label>
                        <select class="form-select form-select-sm" id="hist-cat">
                            ${catOptions}
                        </select>
                    </div>
                    <div class="col-md-2 mb-2">
                        <label class="form-label fw-bold small">Search Name/Item</label>
                        <input type="text" class="form-control form-control-sm" id="hist-search" placeholder="Search...">
                    </div>
                    <div class="col-md-2 mb-2">
                        <button class="btn btn-primary btn-sm w-100" id="btn-filter-hist">
                            <i class="fas fa-filter me-1"></i> Apply Filters
                        </button>
                    </div>
                </div>

                <div id="hist-content">
                    <div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>
                </div>
            `;
            view.innerHTML = html;

            // Set default dates (last 7 days)
            const today = new Date();
            const lastWeek = new Date();
            lastWeek.setDate(today.getDate() - 7);

            document.getElementById('hist-from').valueAsDate = lastWeek;
            document.getElementById('hist-to').valueAsDate = today;

            document.getElementById('btn-filter-hist').addEventListener('click', fetchTransactionHistory);

            // Initial fetch
            fetchTransactionHistory();
        });
    }

    function fetchTransactionHistory() {
        const content = document.getElementById('hist-content');
        content.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>';

        const filters = {
            fromDate: document.getElementById('hist-from').value,
            toDate: document.getElementById('hist-to').value,
            type: document.getElementById('hist-type').value,
            category: document.getElementById('hist-cat').value
        };

        const searchInput = document.getElementById('hist-search').value.toLowerCase();

        google.script.run
            .withSuccessHandler(function(data) {
                // Apply frontend search filter for Name/Item (cheaper than sending complex query to backend)
                if (searchInput) {
                    data = data.filter(r =>
                        r.name.toLowerCase().includes(searchInput) ||
                        r.itemName.toLowerCase().includes(searchInput) ||
                        r.rmCode.toLowerCase().includes(searchInput)
                    );
                }
                renderTransactionHistoryTable(data, content);
            })
            .withFailureHandler(function(err) {
                content.innerHTML = `<div class="alert alert-danger">Failed to load history: ${escapeHTML(err.message)}</div>`;
            })
            .getTransactionsHistory(filters);
    }

    function renderTransactionHistoryTable(data, container) {
        // Pagination State
        let currentPage = 1;
        const rowsPerPage = 20;
        const totalPages = Math.ceil(data.length / rowsPerPage);

        function renderPage(page) {
            currentPage = page;
            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = data.slice(start, end);

            let html = `
                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered table-sm align-middle" style="font-size: 0.9rem;">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Txn ID</th>
                                    <th>Name</th>
                                    <th>Type</th>
                                    <th>RM Code</th>
                                    <th>Item Name</th>
                                    <th class="text-end">Qty</th>
                                    <th>UOM</th>
                                    <th>Remarks</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${pageData.map(row => {
                                    const typeClass = row.type === 'IN' ? 'text-success fw-bold' : 'text-danger fw-bold';
                                    return `
                                        <tr>
                                            <td>${escapeHTML(row.dateStr)}</td>
                                            <td class="text-muted small">${escapeHTML(row.txnId)}</td>
                                            <td>${escapeHTML(row.name)}</td>
                                            <td class="${typeClass}">${escapeHTML(row.type)}</td>
                                            <td>${escapeHTML(row.rmCode)}</td>
                                            <td>${escapeHTML(row.itemName)}</td>
                                            <td class="text-end fw-bold">${row.qty}</td>
                                            <td>${escapeHTML(row.uom)}</td>
                                            <td>${escapeHTML(row.remarks)}</td>
                                        </tr>
                                    `;
                                }).join('')}
                                ${data.length === 0 ? '<tr><td colspan="9" class="text-center py-4">No transactions found</td></tr>' : ''}
                            </tbody>
                        </table>
                    </div>
            `;

            // Render Pagination Controls if needed
            if (totalPages > 1) {
                html += `
                    <nav class="mt-3">
                        <ul class="pagination justify-content-center mb-0">
                            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                                <a class="page-link" href="#" onclick="event.preventDefault(); renderHistoryPage(${currentPage - 1})">Previous</a>
                            </li>
                            <li class="page-item disabled"><span class="page-link">Page ${currentPage} of ${totalPages}</span></li>
                            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                                <a class="page-link" href="#" onclick="event.preventDefault(); renderHistoryPage(${currentPage + 1})">Next</a>
                            </li>
                        </ul>
                    </nav>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // Make renderPage accessible globally for inline onclick
        window.renderHistoryPage = renderPage;

        renderPage(1);
    }
</script>
